<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Códigos – Pousada Marie Claire</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1e1e1e; color: #ccc; }
  .header { background: #1F3864; color: white; padding: 16px 24px; font-size: 18px; font-weight: 700; }
  .tabs { display: flex; background: #252526; border-bottom: 2px solid #333; }
  .tab { padding: 12px 28px; cursor: pointer; font-size: 14px; font-weight: 600; color: #aaa; border-bottom: 3px solid transparent; transition: all .2s; }
  .tab.active { color: white; border-bottom-color: #2E75B6; }
  .tab:hover { color: white; }
  .panel { display: none; position: relative; }
  .panel.active { display: block; }
  .btn-copy {
    position: fixed; top: 60px; right: 24px;
    background: #2E75B6; color: white; border: none;
    padding: 10px 22px; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .btn-copy:hover { background: #1F5fa6; }
  .btn-copy.copiado { background: #2e7d32; }
  pre {
    padding: 24px; font-size: 13px; line-height: 1.6;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    min-height: calc(100vh - 110px);
  }
  .loading { padding: 40px; color: #888; font-size: 14px; }
</style>
</head>
<body>

<div class="header">📋 Códigos – Pousada Marie Claire</div>

<div class="tabs">
  <div class="tab active" onclick="trocarAba('html')">🌐 GitHub (HTML)</div>
  <div class="tab" onclick="trocarAba('apps')">⚙️ Apps Script</div>
</div>

<button class="btn-copy" id="btn-copy" onclick="copiar()">📋 Copiar tudo</button>

<div class="panel active" id="panel-html">
  <pre id="code-html" class="loading">Carregando...</pre>
</div>
<div class="panel" id="panel-apps">
  <pre id="code-apps" class="loading">Carregando...</pre>
</div>

<script>
  const BASE = 'https://raw.githubusercontent.com/diretoriaMC/revisao-geral-pousada/main/';
  let abaAtiva = 'html';

  function trocarAba(aba) {
    abaAtiva = aba;
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0 && aba === 'html') || (i === 1 && aba === 'apps')));
    document.querySelectorAll('.panel').forEach((p, i) =>
      p.classList.toggle('active', (i === 0 && aba === 'html') || (i === 1 && aba === 'apps')));
  }

  function copiar() {
    const id = abaAtiva === 'html' ? 'code-html' : 'code-apps';
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
      const btn = document.getElementById('btn-copy');
      btn.textContent = '✅ Copiado!';
      btn.classList.add('copiado');
      setTimeout(() => { btn.textContent = '📋 Copiar tudo'; btn.classList.remove('copiado'); }, 2000);
    });
  }

  function carregar(arquivo, elId) {
    fetch(BASE + arquivo + '?t=' + Date.now())
      .then(r => r.text())
      .then(txt => { document.getElementById(elId).textContent = txt; })
      .catch(() => { document.getElementById(elId).textContent = 'Erro ao carregar o arquivo.'; });
  }

  carregar('index.html', 'code-html');
  carregar('apps_script_revisao.js', 'code-apps');
</script>
</body>
</html>
